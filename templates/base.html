<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %} — Система онлайн-записи в автосервис</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
               background: #f4f6f8; color: #1f2933; line-height: 1.5; }
        header { background: #1f3a5f; color: #fff; }
        .wrap { max-width: 980px; margin: 0 auto; padding: 0 20px; }
        header .wrap { display: flex; align-items: center; justify-content: space-between;
                       flex-wrap: wrap; gap: 12px; padding-top: 14px; padding-bottom: 14px; }
        .brand { color: #fff; text-decoration: none; font-weight: 700; font-size: 18px; }
        nav a { color: #d6e2f0; text-decoration: none; margin-left: 18px; }
        nav a:hover, nav a.active { color: #fff; text-decoration: underline; }
        main { padding: 28px 0 40px; }
        h1 { margin-top: 0; font-size: 26px; }
        .card { background: #fff; border: 1px solid #dde3ea; border-radius: 8px;
                padding: 20px 24px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: #fff; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #e5e9ef; vertical-align: top; }
        th { background: #eef2f6; font-weight: 600; }
        tr.highlight td { background: #fff4e5; }
        .btn { display: inline-block; background: #2563eb; color: #fff; border: 0; border-radius: 6px;
               padding: 10px 18px; text-decoration: none; font-size: 15px; cursor: pointer; }
        .btn.secondary { background: #e5e9ef; color: #1f2933; }
        .actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
        .actions .card { margin: 0; }
        .actions h3 { margin-top: 0; }
        form p { margin: 0 0 14px; }
        form label { display: block; font-weight: 600; margin-bottom: 4px; }
        form input, form select, form textarea { width: 100%; max-width: 480px; padding: 8px 10px;
               border: 1px solid #c7d0db; border-radius: 6px; font: inherit; }
        .helptext { display: block; color: #6b7785; font-size: 13px; }
        .alert { border-radius: 8px; padding: 16px 20px; margin-bottom: 20px; }
        .alert.ok { background: #e7f6ec; border: 1px solid #9fd5b0; }
        .alert.error { background: #fdecec; border: 1px solid #f1a7a7; }
        .status { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 13px;
                  background: #e5e9ef; }
        .status.new { background: #dbeafe; }
        .status.ok { background: #dcfce7; }
        dl { display: grid; grid-template-columns: 220px 1fr; gap: 8px 16px; margin: 0; }
        dt { color: #6b7785; }
        dd { margin: 0; }
        footer { color: #6b7785; font-size: 13px; padding-bottom: 30px; }
    </style>
</head>
<body>
<header>
    <div class="wrap">
        <a class="brand" href="/">🚗 Система онлайн-записи в автосервис</a>
        <nav>
            {% with p=request.path %}
            <a href="/" {% if p == "/" %}class="active"{% endif %}>Главная</a>
            <a href="/bookings/new/" {% if p == "/bookings/new/" %}class="active"{% endif %}>Записаться</a>
            <a href="/bookings/" {% if p == "/bookings/" %}class="active"{% endif %}>Записи</a>
            <a href="/bookings/rejected/" {% if p == "/bookings/rejected/" %}class="active"{% endif %}>Отказы</a>
            {% endwith %}
        </nav>
    </div>
</header>
<main>
    <div class="wrap">
        {% block content %}{% endblock %}
    </div>
</main>
<footer>
    <div class="wrap">Система онлайн-записи в автосервис · версия 0.0.2 · данные хранятся в JSON-файлах</div>
</footer>
</body>
</html>
